<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#07111f">
<title>GIOSTACCHIO Lavagna's</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GIOSTACCHIO Lavagna's">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}#shell{position:fixed;inset:0;background:#07111f}iframe{width:100%;height:100%;border:0;display:block;background:#07111f}.offline{display:none;position:absolute;inset:0;place-items:center;color:white;padding:24px;text-align:center;background:#07111f}.offline b{font-size:1.2rem;display:block;margin-bottom:8px}.offline span{color:#9fb0c8;line-height:1.45}
</style>
</head>
<body>
<div id="shell"><iframe id="app" title="GIOSTACCHIO Lavagna's" src="https://giostacchio.github.io/Basket-playbook/lavagna/?v=0.3&standalone=1" allow="fullscreen"></iframe><div class="offline" id="offline"><div><b>GIOSTACCHIO Lavagna's</b><span>Connessione non disponibile. Apri l'app una volta online per caricare la lavagna.</span></div></div></div>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
const f=document.getElementById('app'),o=document.getElementById('offline');
function net(){if(navigator.onLine){f.style.display='block';o.style.display='none'}else{f.style.display='block';o.style.display='none'}}
window.addEventListener('online',net);window.addEventListener('offline',net);net();
</script>
</body>
</html>
