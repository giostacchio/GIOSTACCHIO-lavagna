<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#07111f">
<title>GIOSTACCHIO Lavagna's</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GIOSTACCHIO Lavagna's">
<style>
html,body{margin:0;width:100%;height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.loading{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px}.loading b{font-size:1.15rem;display:block;margin-bottom:8px}.loading span{color:#9fb0c8;line-height:1.45}
</style>
</head>
<body>
<div class="loading"><div><b>🏀 GIOSTACCHIO Lavagna's</b><span>Caricamento lavagna…</span></div></div>
<script>
(async()=>{
  const APP='/Basket-playbook/lavagna/?v=0.3&standalone=1';
  try{
    const r=await fetch(APP,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    html=html.replace("GIOSTACCHIO Lavagna's <span style=\"color:#38bdf8\">V0.3</span>","GIOSTACCHIO Lavagna's <span style=\"color:#38bdf8\">V0.3 Touch</span>");
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><div><b>GIOSTACCHIO Lavagna\'s</b><span>Non riesco a caricare la lavagna. Controlla la connessione e riapri l\'app.</span></div></div>';
  }
})();
</script>
</body>
</html>
